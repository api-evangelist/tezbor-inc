name: Tezbor, Inc.
description: >-
  Tezbor is a Tashkent, Uzbekistan based courier and last-mile logistics company that
  automates the delivery of documents, parcels, and cargo across Uzbekistan. Beyond its
  consumer and business courier service, Tezbor operates a technology platform that exposes
  delivery ordering and tracking through an integration API, ready-made e-commerce plugins
  (WooCommerce, OpenCart, Magento), mobile apps, dashboards, and Telegram bots, so that any
  online store can automatically generate a Tezbor delivery order from each purchase. The
  company is backed by 500 Global, Activat, and StartupBase, and counts brands such as
  Beeline, Ozon, and OQ among its delivery clients.
