- name: Tezbor Delivery Integration API
  description: >-
    Tezbor's integration API lets e-commerce platforms and custom applications create and
    track delivery orders for documents, parcels, and cargo across Uzbekistan. Documented
    integration paths include ready-made WooCommerce, OpenCart, and Magento plugins, with a
    direct API available for custom platforms. No public OpenAPI/Swagger specification was
    discoverable; access is provisioned through a Tezbor business account.
